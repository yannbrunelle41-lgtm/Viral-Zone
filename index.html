<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleurs Roussel</title>
  <link rel="stylesheet" href="dist/output.css">
  <!-- defer : le script s'exécute une fois la page lue -->
  <script src="js/app.js" defer></script>
</head>
<body class="bg-white text-roussel-texte">

  <!-- En-tête commun du site -->
  <header class="bg-roussel-vert text-white">
    <div class="mx-auto flex max-w-5xl flex-col gap-3 px-4 py-4 md:flex-row md:items-center md:justify-between">
      <a href="index.html" class="text-xl font-bold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">Fleurs Roussel</a>
      <nav aria-label="Navigation principale">
        <ul class="flex flex-wrap gap-x-5 gap-y-2">
          <li><a href="bouquets.html" class="hover:underline focus-visible:outline-2 focus-visible:outline-white">Bouquets</a></li>
          <li><a href="abonnement.html" class="hover:underline focus-visible:outline-2 focus-visible:outline-white">Abonnement</a></li>
          <li><a href="contact.html" class="hover:underline focus-visible:outline-2 focus-visible:outline-white">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenu" class="mx-auto max-w-5xl px-4 py-8">

    <!-- Deux colonnes : JavaScript répartit les fleurs du catalogue. -->
    <section aria-label="Liste des fleurs">
      <div id="liste-fleurs" class="grid grid-cols-2 items-start gap-4 md:gap-6"></div>
      <p id="erreur-fleurs" role="alert" hidden>Impossible de charger les fleurs.</p>
    </section>

    <!-- Modèle réutilisé pour chaque fleur, sans ajouter de données au catalogue. -->
    <template id="modele-fleur">
      <!-- Carte sans fond coloré, bordure arrondie à 16 px et padding commun. -->
      <li class="relative flex items-stretch gap-0 overflow-hidden rounded-[16px] border border-roussel-vert px-[32px] py-[16px]">
        <!-- Même hauteur que le bloc texte ; l'illustration reste entière et proportionnée. -->
        <div class="relative w-1/2 shrink-0">
          <img class="absolute inset-0 h-full w-full object-contain object-left" src="" alt="">
        </div>
        <div class="flex w-1/2 min-w-0 flex-col justify-center gap-2 p-2 md:p-4">
          <h2 class="break-words font-bold"></h2>
          <p class="break-words text-sm text-roussel-gris"></p>
        </div>
      </li>
    </template>

  </main>

  <!-- Pied de page commun du site -->
  <footer class="mt-12 bg-roussel-vert-clair">
    <div class="mx-auto max-w-5xl px-4 py-6 text-roussel-gris">
      <p><strong class="text-roussel-vert">Fleurs Roussel</strong>, 14 rue Colbert, 37000 Tours</p>
    </div>
  </footer>

</body>
</html>
